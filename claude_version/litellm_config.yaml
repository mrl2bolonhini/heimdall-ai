# Servidor MCP unificado (heimdall_mcp.py). O LiteLLM o expõe em
# http://<host>:9000/mcp para clientes como o open-client.
mcp_servers:
  heimdall:
    url: http://localhost:8000/mcp
    transport: http

litellm_settings:
  drop_params: true

general_settings:
  # Definida pelo start_ecosystem.sh (arquivo .env). Não escreva a chave aqui.
  master_key: os.environ/LITELLM_MASTER_KEY
