# Todos os modelos usam o prefixo ollama_chat/ (endpoint /api/chat do Ollama),
# que é o que suporta tool calling. O prefixo ollama/ usa /api/generate e não suporta.
#
# IMPORTANTE: o modelo só chama ferramentas se o template dele no Ollama tiver
# suporte a tools. Verifique com:  ollama show NOME --template   (procure por .Tools)
# Marquei como false os que muito provavelmente não têm; ajuste depois de testar.

model_list:
  - model_name: qwen-3.8-uncensored
    litellm_params:
      model: ollama_chat/eriktonon/qwen3.8-uncensored:9b
      api_base: http://localhost:11434
      num_ctx: 8192
    model_info:
      supports_function_calling: true

  - model_name: gemma-4-uncensored
    litellm_params:
      model: ollama_chat/eriktonon/gemma4-uncensored
      api_base: http://localhost:11434
      num_ctx: 8192
    model_info:
      supports_function_calling: true

  - model_name: dolphin3-cyber-8b
    litellm_params:
      model: ollama_chat/mparvin/dolphin3-cyber-8b-gguf:q8_0
      api_base: http://localhost:11434
      num_ctx: 8192
    model_info:
      supports_function_calling: true

  - model_name: deepseek-coder-v2:16b
    litellm_params:
      model: ollama_chat/deepseek-coder-v2:16b
      api_base: http://localhost:11434
      num_ctx: 6144   # o GitOps usa trechos pequenos; menos contexto = menos memória
      keep_alive: "30s"   # libera a memória logo depois da análise do GitOps
    model_info:
      supports_function_calling: true

  # Mesma família, sem etapa de raciocínio: responde em cerca de metade do tempo.
  # Confirme com "ollama show qwen3-vl:8b-instruct" se aparecem vision e tools.
  - model_name: qwen3-vl-instruct
    litellm_params:
      model: ollama_chat/qwen3-vl:8b-instruct
      api_base: http://localhost:11434
      num_ctx: 8192
      keep_alive: "2m"   # modelo dos fluxos: libera a memória pouco depois do último uso
    model_info:
      supports_function_calling: true
      supports_vision: true

  - model_name: bonsai-27b
    litellm_params:
      model: ollama_chat/eriktonon/bonsai-2-uncensored:27b
      api_base: http://localhost:11434
      num_ctx: 8192
      keep_alive: "1m"   # modelo grande: não fica ocupando a memória depois da resposta
    model_info:
      supports_function_calling: true

  # Modelo de saúde (Google MedGemma, base Gemma 3, 4 bilhões de parâmetros, 3,3 GB). Usado só pelo monitor de saúde, sem ferramentas.
  # Baixe com: ollama pull medgemma:4b
  - model_name: medgemma
    litellm_params:
      model: ollama_chat/medgemma:4b
      api_base: http://localhost:11434
      num_ctx: 8192
      keep_alive: "1m"
    model_info:
      supports_function_calling: false

# Servidor MCP unificado (heimdall_mcp.py). O LiteLLM o expõe em
# http://<host>:9000/mcp para clientes como o open-client.
mcp_servers:
  # Ferramentas do Mac (arquivos, métricas, memória, documentos): só administrador.
  heimdall:
    url: http://localhost:8000/mcp
    transport: http
  # Ferramentas seguras (web, cálculo, RSS etc.): podem ser compartilhadas.
  heimdall_public:
    url: http://localhost:8001/mcp
    transport: http

  # Documentação oficial da AWS (servidor MCP da AWS Labs, rodado via uvx).
  # Requer o uv instalado no Mac:  brew install uv
  aws_docs:
    transport: stdio
    command: uvx
    args: ["awslabs.aws-documentation-mcp-server@latest"]
    env:
      FASTMCP_LOG_LEVEL: "ERROR"
      AWS_DOCUMENTATION_PARTITION: "aws"

# Pesquisa na web nativa do LiteLLM (é a seção "pesquisa" do app, separada do MCP).
# O SearXNG precisa ter o formato JSON habilitado; o start_heimdall.sh já cuida disso.
search_tools:
  - search_tool_name: searxng-search
    litellm_params:
      search_provider: searxng
      api_base: http://localhost:8080

litellm_settings:
  drop_params: true

general_settings:
  # Definida pelo start_heimdall.sh (arquivo .env). Não escreva a chave aqui.
  master_key: os.environ/LITELLM_MASTER_KEY
